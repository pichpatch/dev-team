# Technical Lead of my-dev-team. Start a session as this role with: codex -p my-tech-lead
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
# No OS sandbox, as for every CLI in my-dev-team: the worktree and task packet
# keep the work in place, and the role can reach the local database and start
# other CLIs as sub-agents.
sandbox_mode = "danger-full-access"
